<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>toio COCKPIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06080e;
    --panel: #121620;
    --track: #242836;
    --dim: #505868;
    --text: #dce4f0;
    --cyan: #00c8ff;
    --yellow: #ffd200;
    --red: #ff3c3c;
    --green: #3cdc6e;
    --orange: #ff8c00;
    --button: #222838;
    --button-edge: #464e62;
    --button-light: #606a82;
    --depth: 4px;
    --tone: var(--cyan);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Orbitron", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overflow: hidden;
    display: grid;
    grid-template-columns: 92px 1fr minmax(150px, 30vw);
    grid-template-rows: 34px 1fr;
    grid-template-areas: "status status status" "left center right";
    gap: 10px;
    padding: 0 max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }

  /* ステータスバー */
  #statusBar {
    grid-area: status; display: flex; align-items: center; gap: 10px;
    margin: 0 calc(-1 * max(10px, env(safe-area-inset-left)));
    padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
    background: var(--panel); border-bottom: 1px solid var(--tone);
  }
  #statusDot { width: 10px; height: 10px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 8px var(--tone); flex: none; }
  #statusText { font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #brand { margin-left: auto; font-size: 10px; color: var(--dim); letter-spacing: 0.1em; white-space: nowrap; }

  /* 押せるボタン。影で浮かせ、押している間は沈めて accent の色にする */
  .btn {
    --accent: var(--cyan);
    position: relative; border-radius: 10px; color: var(--text); font: inherit;
    background: var(--button); border: 1px solid var(--button-edge);
    box-shadow: inset 0 1px 0 var(--button-light), 0 var(--depth) 0 #000;
    transition: transform 40ms, box-shadow 40ms, background 40ms;
    -webkit-tap-highlight-color: transparent; padding: 0;
  }
  .btn.pressed, .btn:active {
    transform: translateY(var(--depth));
    box-shadow: 0 0 0 #000, 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--button) 65%, var(--accent));
    border-color: var(--accent);
  }

  /* 左: 速さのギア・ギア表示・接続 */
  #left { grid-area: left; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #speedGear { height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #speedGearLabel { font-size: 13px; font-weight: 700; color: var(--accent); }
  #speedGearBars { display: flex; gap: 4px; }
  #speedGearBars i { width: 12px; height: 6px; background: var(--track); }
  #speedGearBars i.on { background: var(--accent); }
  #gears { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; min-height: 0; }
  #gears span { width: 34px; height: 26px; line-height: 26px; text-align: center; border-radius: 6px; font-weight: 700; font-size: 15px; color: var(--dim); }
  #gears span.on { background: var(--cyan); color: var(--bg); box-shadow: 0 0 10px color-mix(in srgb, var(--cyan) 60%, transparent); }
  #gears span.on.rev { background: var(--orange); box-shadow: 0 0 10px color-mix(in srgb, var(--orange) 60%, transparent); }
  #connect { height: 50px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: var(--green); --accent: var(--green); }
  #connect.connected { color: var(--dim); --accent: var(--red); }

  /* 中央: メーター */
  #center { grid-area: center; display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 8px; }
  #gaugeWrap { flex: 1; min-height: 0; position: relative; }
  #gauge { position: absolute; inset: 0; width: 100%; height: 100%; }
  #gauge text { font-family: "Orbitron", system-ui, sans-serif; }
  #horn { cursor: pointer; }
  #horn circle.face { fill: var(--button); stroke: var(--button-edge); stroke-width: 1; }
  #horn circle.shadow { fill: #000; }
  #horn.pressed { transform: translateY(2px); }
  #horn.pressed circle.face { fill: var(--orange); stroke: var(--orange); filter: drop-shadow(0 0 6px var(--orange)); }
  #horn.pressed circle.shadow { opacity: 0; }
  #horn.pressed text { fill: var(--bg); }
  #bottomRow { display: flex; gap: 10px; height: 46px; flex: none; }
  .meter { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 10px; min-width: 0; }
  .meterHead { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); }
  .meterHead b { color: var(--text); font-weight: 700; }
  .bar { position: relative; height: 9px; border: 1px solid var(--dim); border-radius: 3px; overflow: hidden; }
  .bar i { position: absolute; top: 1px; bottom: 1px; }
  #battery, #steerBox { border-radius: 10px; background: var(--panel); }
  #batteryFill { left: 1px; width: 0; background: var(--green); }
  #steerBar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--dim); }
  #steerFill { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

  /* 右: 前進・後退 */
  #right { grid-area: right; display: flex; flex-direction: column; gap: 14px; padding-bottom: var(--depth); min-height: 0; }
  .drive { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; touch-action: none; color: var(--accent); }
  .drive svg { width: 38%; max-width: 64px; height: auto; fill: currentColor; }
  .drive span { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; }
  .drive.pressed { color: var(--text); }
  #forward { --accent: #2f8cff; }
  #back { --accent: var(--red); }

  /* 縦持ちのときは横にしてもらう */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg);
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font-family: system-ui, sans-serif; font-size: 16px; color: var(--text);
  }
  #rotate svg { width: 72px; fill: none; stroke: var(--cyan); stroke-width: 3; }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
  <div id="statusBar">
    <div id="statusDot"></div>
    <div id="statusText">未接続</div>
    <div id="brand">toio COCKPIT</div>
  </div>

  <div id="left">
    <button id="speedGear" class="btn"><div id="speedGearLabel"></div><div id="speedGearBars"><i></i><i></i><i></i></div></button>
    <div id="gears"><span data-g="P">P</span><span data-g="R">R</span><span data-g="N">N</span><span data-g="D">D</span></div>
    <button id="connect" class="btn">CONNECT</button>
  </div>

  <div id="center">
    <div id="gaugeWrap">
      <svg id="gauge" viewBox="0 0 220 200" preserveAspectRatio="xMidYMid meet">
        <g id="segments"></g>
        <g id="ticks"></g>
        <circle id="needle" r="5" fill="#dce4f0" style="display:none"/>
        <g id="horn" style="display:none">
          <circle class="shadow" cx="110" cy="102" r="34"/>
          <circle class="face" cx="110" cy="100" r="34"/>
          <text x="110" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#dce4f0">HORN</text>
        </g>
        <text id="detail" x="110" y="104" text-anchor="middle" font-size="9" fill="#dce4f0" style="font-family: system-ui, sans-serif">toio に接続してください</text>
        <text id="speedText" x="110" y="176" text-anchor="middle" font-size="30" font-weight="900" fill="#505868">0</text>
        <text x="110" y="192" text-anchor="middle" font-size="7" fill="#505868">km/h</text>
      </svg>
    </div>
    <div id="bottomRow">
      <div id="battery" class="meter">
        <div class="meterHead"><span>TOIO</span><b id="batteryText">--</b></div>
        <div class="bar"><i id="batteryFill"></i></div>
      </div>
      <div id="steerBox" class="meter">
        <div class="meterHead"><span>STEER</span><b>TILT</b></div>
        <div class="bar" id="steerBar"><i id="steerFill"></i></div>
      </div>
    </div>
  </div>

  <div id="right">
    <button id="forward" class="btn drive"><svg viewBox="0 0 24 24"><path d="M12 3 22 17H2z"/></svg><span>FWD</span></button>
    <button id="back" class="btn drive"><svg viewBox="0 0 24 24"><path d="M12 21 2 7h20z"/></svg><span>BACK</span></button>
  </div>

  <div id="rotate">
    <svg viewBox="0 0 48 48"><rect x="14" y="6" width="20" height="36" rx="3"/><path d="M40 30a16 16 0 0 1-12 12m0 0 4-1m-4 1 1-4"/></svg>
    横向きにして使ってください
  </div>

<script>
const SERVICE_UUID = "10b20100-5b3b-4571-9508-cf3efcd7bbae";
const MOTOR_UUID   = "10b20102-5b3b-4571-9508-cf3efcd7bbae";
const SOUND_UUID   = "10b20104-5b3b-4571-9508-cf3efcd7bbae";
const BATTERY_UUID = "10b20108-5b3b-4571-9508-cf3efcd7bbae";

// 速さのギア（前進・後退の速さ）。遅い順
const SPEED_GEARS = [
  { label: "SLOW", forward: 40, back: 30, color: "var(--green)" },
  { label: "LOW", forward: 70, back: 50, color: "var(--cyan)" },
  { label: "HIGH", forward: 100, back: 70, color: "var(--orange)" },
];
const MAX_SPEED = 115;     // toio のモーター最大指示値
const MIN_SPEED = 10;      // これ未満は動かないので 0 扱い
const TURN_RATIO = 0.4;    // 最大まで傾けたときの左右差（片側分）。走る速さに対する割合
const STEER_GAIN = 1.2;    // 約55度（sin≈0.83）傾けたら最大旋回
const DEADZONE = 0.08;     // 約5度以内は無視
const ACCEL = 80;          // 加速の速さ（1秒あたりに上がる速度）
const DECEL = 140;         // 減速の速さ（1秒あたりに下がる速度）
const SEND_INTERVAL = 50;  // ms
// toio の MIDI 再生データ: [0x03, 繰り返し回数(0は無限), 音の数, (長さ[10ms], ノート番号, 音量)...]
// toio の効果音には合うものがないので作る。ノート番号 128 は無音
// クラクション: 低めの1音(F4)をそのまま伸ばす。太い「ブーッ」
const HORN_SOUND = [0x03, 0, 1, 100, 65, 255];
// バック音: 「ピーッ、ピーッ」(E5を0.4秒鳴らして0.4秒休む)
const BACKUP_SOUND = [0x03, 0, 2, 40, 76, 160, 40, 128, 0];
const STOP_SOUND = [0x01];

let device = null;
let motor = null, sound = null;
let motorQueued = false;
let gattChain = Promise.resolve();
let forwardPressed = false, backPressed = false, hornPressed = false;
let lastSound = STOP_SOUND; // 最後に鳴らした音。同じ音を送り直さないために使う
let steerRaw = 0;          // 画面の左右方向の傾き（-1〜1、右に傾けると +）
let orientationListening = false;
let speedGear = 1;
let throttle = 0;          // 今の速さ (-100〜100)。メーター表示用
let shownSpeed = 0;        // 針をなめらかに動かすための表示用の値

const $ = (id) => document.getElementById(id);

try { speedGear = Math.min(SPEED_GEARS.length - 1, Math.max(0, +(localStorage.getItem("speedGear") ?? 1))); } catch (_) {}

function setStatus(text, tone = "cyan") {
  $("statusText").textContent = text;
  document.documentElement.style.setProperty("--tone", `var(--${tone})`);
}

// Web Bluetooth は同時に1つしか書けないので、書き込みは順番に並べる
function enqueue(fn) {
  const p = gattChain.then(fn);
  gattChain = p.catch(() => {});
  return p;
}

// ---- メーター ----
const GAUGE = { cx: 110, cy: 100, rOut: 92, rIn: 80, start: 135, sweep: 270, step: 3 };
const svgNS = "http://www.w3.org/2000/svg";
const segments = [];

function polar(r, deg) {
  const a = deg * Math.PI / 180;
  return [GAUGE.cx + r * Math.cos(a), GAUGE.cy + r * Math.sin(a)];
}

function lerpColor(a, b, t) {
  return a.map((v, i) => Math.round(v + (b[i] - v) * t));
}
// 速さの割合で 水色 → 黄 → 赤 と変える
function speedColor(ratio) {
  const c = ratio < 0.7 ? lerpColor([0, 200, 255], [255, 210, 0], ratio / 0.7)
                        : lerpColor([255, 210, 0], [255, 60, 60], (ratio - 0.7) / 0.3);
  return `rgb(${c})`;
}

function buildGauge() {
  for (let a = 0; a < GAUGE.sweep; a += GAUGE.step) {
    const d0 = GAUGE.start + a, d1 = d0 + GAUGE.step + 0.3;
    const [x0, y0] = polar(GAUGE.rOut, d0), [x1, y1] = polar(GAUGE.rOut, d1);
    const [x2, y2] = polar(GAUGE.rIn, d1), [x3, y3] = polar(GAUGE.rIn, d0);
    const p = document.createElementNS(svgNS, "path");
    p.setAttribute("d", `M${x0} ${y0}A${GAUGE.rOut} ${GAUGE.rOut} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${GAUGE.rIn} ${GAUGE.rIn} 0 0 0 ${x3} ${y3}Z`);
    p.dataset.color = speedColor(a / GAUGE.sweep);
    $("segments").appendChild(p);
    segments.push(p);
  }
  // 目盛り。20ごとに長い線と数字
  for (let v = 0; v <= 100; v += 5) {
    const deg = GAUGE.start + GAUGE.sweep * v / 100;
    const major = v % 20 === 0;
    const r0 = GAUGE.rIn - 4, r1 = r0 - (major ? 9 : 4);
    const [x0, y0] = polar(r0, deg), [x1, y1] = polar(r1, deg);
    const l = document.createElementNS(svgNS, "line");
    Object.entries({ x1: x0, y1: y0, x2: x1, y2: y1, stroke: major ? "#dce4f0" : "#505868", "stroke-width": major ? 1.5 : 1 })
      .forEach(([k, val]) => l.setAttribute(k, val));
    $("ticks").appendChild(l);
    if (major) {
      const [tx, ty] = polar(r1 - 9, deg);
      const t = document.createElementNS(svgNS, "text");
      Object.entries({ x: tx, y: ty + 2.5, "text-anchor": "middle", "font-size": 7, fill: "#505868" })
        .forEach(([k, val]) => t.setAttribute(k, val));
      t.textContent = v;
      $("ticks").appendChild(t);
    }
  }
}

function drawGauge() {
  shownSpeed += (Math.abs(throttle) - shownSpeed) * 0.3;
  if (Math.abs(Math.abs(throttle) - shownSpeed) < 0.5) shownSpeed = Math.abs(throttle);
  const ratio = shownSpeed / 100;
  const filled = GAUGE.sweep * ratio;
  const reverse = throttle < 0;
  segments.forEach((p, i) => {
    p.setAttribute("fill", i * GAUGE.step < filled ? (reverse ? "#ff8c00" : p.dataset.color) : "#242836");
  });
  const needle = $("needle");
  needle.style.display = motor ? "" : "none";
  const [nx, ny] = polar((GAUGE.rOut + GAUGE.rIn) / 2, GAUGE.start + filled);
  needle.setAttribute("cx", nx);
  needle.setAttribute("cy", ny);
  const speed = Math.round(shownSpeed);
  $("speedText").textContent = speed;
  $("speedText").setAttribute("fill", speed === 0 ? "#505868" : "#dce4f0");
  requestAnimationFrame(drawGauge);
}

// ---- 表示の更新 ----
function updateSpeedGear() {
  const g = SPEED_GEARS[speedGear];
  $("speedGear").style.setProperty("--accent", g.color);
  $("speedGearLabel").textContent = g.label;
  [...$("speedGearBars").children].forEach((el, i) => el.classList.toggle("on", i <= speedGear));
}

function updateGear() {
  const gear = !motor ? "P" : throttle > 0 ? "D" : throttle < 0 ? "R" : "N";
  document.querySelectorAll("#gears span").forEach((el) => {
    el.classList.toggle("on", el.dataset.g === gear);
    el.classList.toggle("rev", el.dataset.g === "R");
  });
}

function updateConnection() {
  const btn = $("connect");
  btn.textContent = motor ? "DISCONNECT" : "CONNECT";
  btn.classList.toggle("connected", !!motor);
  $("horn").style.display = motor ? "" : "none";
  $("detail").style.display = motor ? "none" : "";
  if (!motor) setBattery(-1);
}

function setBattery(percent) {
  $("batteryText").textContent = percent >= 0 ? percent + "%" : "--";
  const fill = $("batteryFill");
  fill.style.width = `calc(${Math.max(0, percent)}% - 2px)`;
  fill.style.background = percent > 50 ? "var(--green)" : percent > 20 ? "var(--yellow)" : "var(--red)";
}

function updateSteer(steer) {
  const fill = $("steerFill");
  fill.style.left = (50 + Math.min(0, steer) * 50) + "%";
  fill.style.width = (Math.abs(steer) * 50) + "%";
}

// ---- 傾き ----
// 画面の回転角（縦持ち 0、横持ちで 90 / -90 / 270）
function screenAngle() {
  return screen.orientation?.angle ?? window.orientation ?? 0;
}

// deviceorientation から「上」方向ベクトルを端末座標で求め、
// 画面の右方向とのなす量をハンドルの切れ角として使う（平置きでもハンドル持ちでも同じように効く）
function onOrientation(e) {
  const b = (e.beta ?? 0) * Math.PI / 180;
  const g = (e.gamma ?? 0) * Math.PI / 180;
  const ux = -Math.sin(g) * Math.cos(b);
  const uy = Math.sin(b);
  const t = screenAngle() * Math.PI / 180;
  // 画面の右方向（端末座標）= (cos t, -sin t)。右側が下がると上ベクトルとの内積が負になる
  steerRaw = -(ux * Math.cos(t) - uy * Math.sin(t));
}

function steerValue() {
  const s = steerRaw;
  if (Math.abs(s) < DEADZONE) return 0;
  return Math.max(-1, Math.min(1, s * STEER_GAIN));
}

// ---- 接続 ----
$("connect").addEventListener("click", async () => {
  if (motor) {
    await sendMotor(0, 0, true);
    device?.gatt.disconnect();
    return;
  }
  try {
    // 1. 傾きセンサーの許可（iOS は必須、ユーザー操作の中で呼ぶ）
    if (!orientationListening) {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        const p = await DeviceOrientationEvent.requestPermission();
        if (p !== "granted") { setStatus("傾きの許可が得られませんでした", "red"); return; }
      }
      window.addEventListener("deviceorientation", onOrientation);
      orientationListening = true;
    }

    // 2. BLE 接続
    if (!navigator.bluetooth) { setStatus("このブラウザは Web Bluetooth 非対応です", "red"); return; }
    setStatus("toio を探しています…", "yellow");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
    });
    device.addEventListener("gattserverdisconnected", () => {
      motor = sound = null;
      updateConnection();
      setStatus("切断されました", "yellow");
    });
    setStatus("接続しています…", "yellow");
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    const m = await service.getCharacteristic(MOTOR_UUID);
    try { sound = await service.getCharacteristic(SOUND_UUID); } catch (_) {}
    lastSound = STOP_SOUND;
    try {
      const battery = await service.getCharacteristic(BATTERY_UUID);
      battery.addEventListener("characteristicvaluechanged", (e) => setBattery(e.target.value.getUint8(0)));
      setBattery((await battery.readValue()).getUint8(0));
      await battery.startNotifications();
    } catch (_) {}
    motor = m;
    updateConnection();
    setStatus("接続しました：" + (device.name || "toio"), "green");

    // 画面が消えないようにする（対応環境のみ）
    try { await navigator.wakeLock?.request("screen"); } catch (_) {}
  } catch (err) {
    setStatus("エラー: " + err.message, "red");
  }
});

$("speedGear").addEventListener("click", () => {
  speedGear = (speedGear + 1) % SPEED_GEARS.length;
  try { localStorage.setItem("speedGear", speedGear); } catch (_) {}
  updateSpeedGear();
});

// 押している間だけ効くボタン
function bindHold(el, set) {
  const on = (e) => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); el.classList.add("pressed"); set(true); };
  const off = () => { if (!el.classList.contains("pressed")) return; el.classList.remove("pressed"); set(false); };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off);
  el.addEventListener("lostpointercapture", off);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}
bindHold($("forward"), (v) => { forwardPressed = v; });
bindHold($("back"), (v) => { backPressed = v; });
bindHold($("horn"), (v) => { hornPressed = v; });

// 画面から離れたら止める
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { forwardPressed = backPressed = hornPressed = false; sendMotor(0, 0, true); }
});

// ---- 走り ----
// 符号付き速度 → toio の [向き, 速度]
function toMotor(speed) {
  let s = Math.round(Math.min(Math.abs(speed), MAX_SPEED));
  if (s < MIN_SPEED) s = 0;
  return [speed >= 0 ? 0x01 : 0x02, s];
}

function sendMotor(left, right, force = false) {
  if (!motor || (motorQueued && !force)) return Promise.resolve();
  motorQueued = true;
  const [dl, sl] = toMotor(left);
  const [dr, sr] = toMotor(right);
  // 0x01: 時間指定なしモーター制御 / 左モーター(0x01) / 右モーター(0x02)
  const data = new Uint8Array([0x01, 0x01, dl, sl, 0x02, dr, sr]);
  const m = motor;
  return enqueue(() => m.writeValueWithoutResponse(data))
    .catch(() => {})
    .finally(() => { motorQueued = false; });
}

function updateSound(data) {
  if (!sound || data === lastSound) return;
  lastSound = data;
  const s = sound;
  enqueue(() => s.writeValueWithResponse(new Uint8Array(data))).catch(() => {});
}

setInterval(() => {
  const steer = steerValue();
  const g = SPEED_GEARS[speedGear];

  // 前進と後退を同時押し・どちらも押していない → 停止
  let target = 0;
  if (forwardPressed && !backPressed) target = g.forward;
  else if (backPressed && !forwardPressed) target = -g.back;
  if (!motor) target = 0;

  // 目標の速さへ少しずつ近づける。速くなるときは ACCEL、遅くなるとき（向きが変わるときも）は DECEL
  const speedingUp = Math.abs(target) > Math.abs(throttle) && (throttle === 0 || Math.sign(target) === Math.sign(throttle));
  const step = (speedingUp ? ACCEL : DECEL) * SEND_INTERVAL / 1000;
  throttle = Math.abs(target - throttle) <= step ? target : throttle + Math.sign(target - throttle) * step;

  // 曲がる量は今の速さに合わせる。後退中は車のバックと同じ向きに曲がる
  const turn = steer * throttle * TURN_RATIO;

  updateSteer(steer);
  updateGear();
  sendMotor(throttle + turn, throttle - turn);

  // クラクションボタンを押している間はクラクション。それ以外で後ろに動いている間はバック音
  updateSound(hornPressed ? HORN_SOUND : throttle < 0 ? BACKUP_SOUND : STOP_SOUND);
}, SEND_INTERVAL);

buildGauge();
updateSpeedGear();
updateConnection();
updateGear();
requestAnimationFrame(drawGauge);
</script>
