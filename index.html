<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>toio COCKPIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06080e;
    --panel: #121620;
    --track: #242836;
    --dim: #505868;
    --text: #dce4f0;
    --cyan: #00c8ff;
    --yellow: #ffd200;
    --red: #ff3c3c;
    --green: #3cdc6e;
    --orange: #ff8c00;
    --button: #222838;
    --button-edge: #464e62;
    --button-light: #606a82;
    --depth: 4px;
    --tone: var(--cyan);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Orbitron", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overflow: hidden;
    display: grid;
    grid-template-columns: 92px 1fr minmax(150px, 30vw);
    grid-template-rows: 34px 1fr;
    grid-template-areas: "status status status" "left center right";
    gap: 10px;
    padding: 0 max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }

  /* ステータスバー */
  #statusBar {
    grid-area: status; display: flex; align-items: center; gap: 10px;
    margin: 0 calc(-1 * max(10px, env(safe-area-inset-left)));
    padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
    background: var(--panel); border-bottom: 1px solid var(--tone);
  }
  #statusDot { width: 10px; height: 10px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 8px var(--tone); flex: none; }
  #statusText { font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #statusText a { color: var(--cyan); }
  #brand { margin-left: auto; font-size: 10px; color: var(--dim); letter-spacing: 0.1em; white-space: nowrap; }

  /* 押せるボタン。影で浮かせ、押している間は沈めて accent の色にする */
  .btn {
    --accent: var(--cyan);
    position: relative; border-radius: 10px; color: var(--text); font: inherit;
    background: var(--button); border: 1px solid var(--button-edge);
    box-shadow: inset 0 1px 0 var(--button-light), 0 var(--depth) 0 #000;
    transition: transform 40ms, box-shadow 40ms, background 40ms;
    -webkit-tap-highlight-color: transparent; padding: 0;
  }
  .btn.pressed, .btn:active {
    transform: translateY(var(--depth));
    box-shadow: 0 0 0 #000, 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--button) 65%, var(--accent));
    border-color: var(--accent);
  }

  /* 左: 速さのギア・ギア表示・接続 */
  #left { grid-area: left; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #speedGear { height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #speedGearLabel { font-size: 13px; font-weight: 700; color: var(--accent); }
  #speedGearBars { display: flex; gap: 4px; }
  #speedGearBars i { width: 12px; height: 6px; background: var(--track); }
  #speedGearBars i.on { background: var(--accent); }
  #gears { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; min-height: 0; }
  #gears span { width: 34px; height: 26px; line-height: 26px; text-align: center; border-radius: 6px; font-weight: 700; font-size: 15px; color: var(--dim); }
  #gears span.on { background: var(--cyan); color: var(--bg); box-shadow: 0 0 10px color-mix(in srgb, var(--cyan) 60%, transparent); }
  #gears span.on.rev { background: var(--orange); box-shadow: 0 0 10px color-mix(in srgb, var(--orange) 60%, transparent); }
  #spin { height: 50px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #b07cff; --accent: #b07cff; touch-action: none; }
  #spin svg { display: block; width: 18px; height: 18px; margin: 0 auto 3px; fill: none; stroke: currentColor; stroke-width: 2.5; }
  #spin.pressed { color: var(--text); }

  /* 接続はステータスバーの右端に小さく置く。切断は子どもが間違えて押さないよう長押し */
  #connect {
    position: relative; overflow: hidden; flex: none; height: 24px; padding: 0 10px;
    border-radius: 12px; border: 1px solid var(--green); background: transparent;
    color: var(--green); font: inherit; font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #connect.connected { border-color: var(--dim); color: var(--dim); }
  #connect::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: color-mix(in srgb, var(--red) 55%, transparent);
  }
  #connect.holding::before { width: 100%; transition: width var(--hold) linear; }
  #connect span { position: relative; }

  /* 画面の切り替え（COCKPIT ⇔ AUTO）。ステータスバーの CONNECT の左に置く */
  #modeSwitch {
    flex: none; height: 24px; padding: 0 10px; border-radius: 12px;
    border: 1px solid var(--yellow); background: transparent; color: var(--yellow);
    font: inherit; font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
    -webkit-tap-highlight-color: transparent;
  }

  /* オートモード: 決まった動き4つと曲4つ。もう一度押すと止まる */
  #auto {
    display: none; grid-row: 2; grid-column: 1 / -1; min-height: 0;
    /* ボタンが増えたので縦にスクロールする。次の段が少しのぞく高さにして、続きがあると分かるようにする */
    grid-template-columns: 52px repeat(4, 1fr); grid-auto-rows: calc((100% - 20px) / 3.3); gap: 10px;
    padding-bottom: var(--depth); overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
  }
  body.auto #auto { display: grid; }
  body.auto #left, body.auto #center, body.auto #right { display: none; }
  .autoLabel { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; color: var(--dim); writing-mode: vertical-rl; letter-spacing: 0.3em; }
  .autoLabel.music { grid-row: span 4; }
  .autoBtn {
    touch-action: pan-y;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; min-height: 0;
    color: var(--accent); font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; white-space: nowrap;
  }
  .autoBtn svg { width: 40%; max-width: 44px; height: auto; max-height: 45%; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .autoBtn.motion { --accent: var(--cyan); }
  .autoBtn.music { --accent: var(--yellow); }
  .autoBtn.active {
    transform: translateY(var(--depth)); color: var(--bg);
    box-shadow: 0 0 0 #000, 0 0 16px color-mix(in srgb, var(--accent) 60%, transparent);
    background: var(--accent); border-color: var(--accent);
  }

  /* 中央: メーター */
  #center { grid-area: center; display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 8px; }
  #gaugeWrap { flex: 1; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; }
  /* メーターの縦横比 (220:200) を保ったまま、入る大きさにする。HORN の位置をメーターに合わせるため */
  #gaugeBox { position: relative; width: min(100cqw, 110cqh); aspect-ratio: 220 / 200; touch-action: none; }
  #gauge { position: absolute; inset: 0; width: 100%; height: 100%; }
  #gauge text { font-family: "Orbitron", system-ui, sans-serif; }
  #horn {
    --accent: var(--orange);
    position: absolute; left: 50%; top: 50%; width: 31%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; font-size: clamp(9px, 4.5cqh, 14px); font-weight: 700; touch-action: none;
  }
  #horn { pointer-events: none; } /* 当たり判定は #gaugeBox でメーターの中心からの距離で取る */
  #horn.pressed { transform: translate(-50%, calc(-50% + var(--depth))); background: var(--orange); color: var(--bg); box-shadow: 0 0 16px var(--orange); }
  #bottomRow { display: flex; gap: 10px; height: 46px; flex: none; }
  .meter { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 10px; min-width: 0; }
  .meterHead { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); }
  .meterHead b { color: var(--text); font-weight: 700; }
  .bar { position: relative; height: 9px; border: 1px solid var(--dim); border-radius: 3px; overflow: hidden; }
  .bar i { position: absolute; top: 1px; bottom: 1px; }
  #battery, #steerBox { border-radius: 10px; background: var(--panel); }
  #batteryFill { left: 1px; width: 0; background: var(--green); }
  #steerBar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--dim); }
  #steerFill { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  /* 傾きの向きは長押しで反転する。子どもが間違えて変えないよう長押し */
  #steerBox { position: relative; overflow: hidden; touch-action: none; }
  #steerBox::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: color-mix(in srgb, var(--cyan) 25%, transparent);
  }
  #steerBox.holding::before { width: 100%; transition: width var(--hold) linear; }
  #steerBox > * { position: relative; }
  #steerMode.reverse { color: var(--orange); }

  /* 右: 前進・後退 */
  #right { grid-area: right; display: flex; flex-direction: column; gap: 14px; padding-bottom: var(--depth); min-height: 0; }
  .drive { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; touch-action: none; color: var(--accent); }
  .drive svg { width: 38%; max-width: 64px; height: auto; fill: currentColor; }
  .drive span { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; }
  .drive.pressed { color: var(--text); }
  #forward { --accent: #2f8cff; }
  #back { --accent: var(--red); }

  /* 縦持ちのときは横にしてもらう */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg);
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font-family: system-ui, sans-serif; font-size: 16px; color: var(--text);
  }
  #rotate svg { width: 72px; fill: none; stroke: var(--cyan); stroke-width: 3; }
  @media (orientation: portrait) { #rotate { display: flex; } }
  #rotateBluefy { margin-top: 16px; text-align: center; font-size: 14px; line-height: 2.2; }
  #rotateBluefy span { color: var(--red); }
  #rotateBluefy a { color: var(--cyan); font-weight: 700; }
  #rotateBluefy br + a { font-size: 16px; }
</style>
</head>
<body>
  <div id="statusBar">
    <div id="statusDot"></div>
    <div id="statusText">未接続</div>
    <div id="brand">toio COCKPIT</div>
    <button id="modeSwitch">AUTO</button>
    <button id="connect"><span>CONNECT</span></button>
  </div>

  <div id="left">
    <button id="speedGear" class="btn"><div id="speedGearLabel"></div><div id="speedGearBars"><i></i><i></i><i></i></div></button>
    <div id="gears"><span data-g="P">P</span><span data-g="R">R</span><span data-g="N">N</span><span data-g="D">D</span><span data-g="S">S</span></div>
    <button id="spin" class="btn"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>SPIN</button>
  </div>

  <div id="center">
    <div id="gaugeWrap">
      <div id="gaugeBox">
        <svg id="gauge" viewBox="0 0 220 200" preserveAspectRatio="xMidYMid meet">
          <g id="segments"></g>
          <g id="ticks"></g>
          <circle id="needle" r="5" fill="#dce4f0" style="display:none"/>
          <text id="detail" x="110" y="104" text-anchor="middle" font-size="9" fill="#dce4f0" style="font-family: system-ui, sans-serif">右上の CONNECT で toio に接続</text>
          <text id="speedText" x="110" y="176" text-anchor="middle" font-size="30" font-weight="900" fill="#505868">0</text>
          <text x="110" y="192" text-anchor="middle" font-size="7" fill="#505868">km/h</text>
        </svg>
        <button id="horn" class="btn" style="display:none">HORN</button>
      </div>
    </div>
    <div id="bottomRow">
      <div id="battery" class="meter">
        <div class="meterHead"><span>TOIO</span><b id="batteryText">--</b></div>
        <div class="bar"><i id="batteryFill"></i></div>
      </div>
      <div id="steerBox" class="meter">
        <div class="meterHead"><span>STEER</span><b id="steerMode">TILT</b></div>
        <div class="bar" id="steerBar"><i id="steerFill"></i></div>
      </div>
    </div>
  </div>

  <div id="right">
    <button id="forward" class="btn drive"><svg viewBox="0 0 24 24"><path d="M12 3 22 17H2z"/></svg><span>FWD</span></button>
    <button id="back" class="btn drive"><svg viewBox="0 0 24 24"><path d="M12 21 2 7h20z"/></svg><span>BACK</span></button>
  </div>

  <div id="auto">
    <div class="autoLabel">うごき</div>
    <button class="btn autoBtn motion" data-motion="circle"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>ぐるぐる</button>
    <button class="btn autoBtn motion" data-motion="square"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>しかく</button>
    <button class="btn autoBtn motion" data-motion="eight"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4.5"/><circle cx="12" cy="16.5" r="4.5"/></svg>8のじ</button>
    <button class="btn autoBtn motion" data-motion="dance"><svg viewBox="0 0 24 24"><path d="M3 12l3-5 4 10 4-10 4 10 3-5"/></svg>ダンス</button>
    <div class="autoLabel music">おと</div>
    <button class="btn autoBtn music" data-music="twinkle"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>きらきらぼし</button>
    <button class="btn autoBtn music" data-music="frog"><svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="3"/><circle cx="16" cy="7" r="3"/><path d="M4 13c0 4 3.6 7 8 7s8-3 8-7M8 15c2.5 1.5 5.5 1.5 8 0"/></svg>かえるのうた</button>
    <button class="btn autoBtn music" data-music="fanfare"><svg viewBox="0 0 24 24"><path d="M3 10v4h3l9 5V5L6 10zM18 9a4 4 0 0 1 0 6M20.5 6.5a8 8 0 0 1 0 11"/></svg>ファンファーレ</button>
    <button class="btn autoBtn music" data-music="siren"><svg viewBox="0 0 24 24"><path d="M6 18v-6a6 6 0 0 1 12 0v6M4 18h16v3H4zM12 2v2M4.2 5.2l1.4 1.4M19.8 5.2l-1.4 1.4"/></svg>ピーポー</button>
    <button class="btn autoBtn music" data-music="mary"><svg viewBox="0 0 24 24"><path d="M7 17a3 3 0 0 1-1-5.8A3.5 3.5 0 0 1 11 7a3.5 3.5 0 0 1 6 1.5 3 3 0 0 1 1 5.8V17zM8 17v3M16 17v3"/></svg>メリーさん</button>
    <button class="btn autoBtn music" data-music="bee"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="5" ry="6"/><path d="M7.5 12h9M7.5 16h9M10 8c-2-4-6-3-5 0s5 1 5 0M14 8c2-4 6-3 5 0s-5 1-5 0"/></svg>ぶんぶんぶん</button>
    <button class="btn autoBtn music" data-music="butterfly"><svg viewBox="0 0 24 24"><path d="M12 7v13M12 10C9 4 3 4 4 9s6 3 8 2M12 10c3-6 9-6 8-1s-6 3-8 2M12 12c-3 1-7 3-5 6s5-3 5-4M12 12c3 1 7 3 5 6s-5-3-5-4"/></svg>ちょうちょう</button>
    <button class="btn autoBtn music" data-music="london"><svg viewBox="0 0 24 24"><path d="M2 9h20M2 19h20M5 9v10M19 9v10M5 19a7 7 0 0 1 14 0M8 9V5h8v4"/></svg>ロンドンばし</button>
    <button class="btn autoBtn music" data-music="fireTruck"><svg viewBox="0 0 24 24"><path d="M2 17V9h11v8M13 11h4l4 4v2M2 17h19"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M4 6h8M5 9V6M9 9V6"/></svg>しょうぼうしゃ</button>
    <button class="btn autoBtn music" data-music="fart"><svg viewBox="0 0 24 24"><path d="M5 14a3 3 0 0 1 1-5.8A4 4 0 0 1 13.5 7a3.5 3.5 0 0 1 4.5 4.5A2.5 2.5 0 0 1 17 16H6a3 3 0 0 1-1-2zM8 19l-1 2M12 19v2M16 19l1 2"/></svg>オナラ</button>
    <button class="btn autoBtn music" data-music="chime"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4M12 3v2"/></svg>チャイム</button>
    <button class="btn autoBtn music" data-music="correct"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>ピンポン</button>
    <button class="btn autoBtn music" data-music="birthday"><svg viewBox="0 0 24 24"><path d="M4 21V13h16v8M3 21h18M4 16c2 1.5 4 1.5 6 0s4-1.5 6 0 3 1 4 0M8 13V9M12 13V9M16 13V9M8 6v.5M12 6v.5M16 6v.5"/></svg>おたんじょうび</button>
    <button class="btn autoBtn music" data-music="yankee"><svg viewBox="0 0 24 24"><path d="M2 20l7-13 4 7 2-3 7 9zM7.5 10l1.5 1 1.5-1"/></svg>アルプス</button>
    <button class="btn autoBtn music" data-music="jingle"><svg viewBox="0 0 24 24"><path d="M12 2l4 6h-2l4 6h-3l4 6H5l4-6H6l4-6H8zM12 20v2"/></svg>ジングルベル</button>
    <button class="btn autoBtn music" data-music="joy"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>よろこびのうた</button>
  </div>

  <div id="rotate">
    <svg viewBox="0 0 48 48"><rect x="14" y="6" width="20" height="36" rx="3"/><path d="M40 30a16 16 0 0 1-12 12m0 0 4-1m-4 1 1-4"/></svg>
    横向きにして使ってください
    <div id="rotateBluefy" hidden><span>このブラウザは Web Bluetooth 非対応です</span><br></div>
  </div>

<script>
const SERVICE_UUID = "10b20100-5b3b-4571-9508-cf3efcd7bbae";
const MOTOR_UUID   = "10b20102-5b3b-4571-9508-cf3efcd7bbae";
const SOUND_UUID   = "10b20104-5b3b-4571-9508-cf3efcd7bbae";
const BATTERY_UUID = "10b20108-5b3b-4571-9508-cf3efcd7bbae";

// 速さのギア（前進・後退の速さ）。遅い順
const SPEED_GEARS = [
  { label: "SLOW", forward: 40, back: 30, color: "var(--green)" },
  { label: "LOW", forward: 70, back: 50, color: "var(--cyan)" },
  { label: "HIGH", forward: 100, back: 70, color: "var(--orange)" },
];
const MAX_SPEED = 115;     // toio のモーター最大指示値
const MIN_SPEED = 10;      // これ未満は動かないので 0 扱い
const TURN_RATIO = 0.4;    // 最大まで傾けたときの左右差（片側分）。走る速さに対する割合
const STEER_GAIN = 1.2;    // 約55度（sin≈0.83）傾けたら最大旋回
const DEADZONE = 0.08;     // 約5度以内は無視
const SPIN_SPEED = 100;    // SPIN を押している間、その場で右に回る速さ
const DISCONNECT_HOLD_MS = 1500; // この時間 CONNECT を長押ししたら切断する
const STEER_REVERSE_HOLD_MS = 1500; // この時間 STEER を長押ししたら傾きの向きを反転する
const ACCEL = 80;         // 加速の速さ（1秒あたりに上がる速度）
const DECEL = 140;         // 減速の速さ（1秒あたりに下がる速度）
const SEND_INTERVAL = 50;  // ms
// toio の MIDI 再生データ: [0x03, 繰り返し回数(0は無限), 音の数, (長さ[10ms], ノート番号, 音量)...]
// toio の効果音には合うものがないので作る。ノート番号 128 は無音
// クラクション: 低めの1音(F4)をそのまま伸ばす。太い「ブーッ」
const HORN_SOUND = [0x03, 0, 1, 100, 65, 255];
// バック音: 「ピーッ、ピーッ」(E5を0.4秒鳴らして0.4秒休む)
const BACKUP_SOUND = [0x03, 0, 2, 40, 76, 160, 40, 128, 0];
const STOP_SOUND = [0x01];

let device = null;
let motor = null, sound = null;
let motorQueued = false;
let gattChain = Promise.resolve();
let forwardPressed = false, backPressed = false, hornPressed = false, spinPressed = false;
let lastSound = STOP_SOUND; // 最後に鳴らした音。同じ音を送り直さないために使う
let steerRaw = 0;          // 画面の左右方向の傾き（-1〜1、右に傾けると +）
let orientationListening = false;
let debugOrientation = null; // ?debug のときだけ、傾きの計算の途中の値を出す
let speedGear = 1;
let throttle = 0;          // 今の速さ (-100〜100)。メーター表示用
let shownSpeed = 0;        // 針をなめらかに動かすための表示用の値

// Web Bluetooth は同時に1つしか書けないので、書き込みは順番に並べる
function enqueue(fn) {
  const p = gattChain.then(fn);
  gattChain = p.catch(() => {});
  return p;
}

// ---- メーター ----
const GAUGE = { cx: 110, cy: 100, rOut: 92, rIn: 80, start: 135, sweep: 270, step: 3 };
const svgNS = "http://www.w3.org/2000/svg";
const segments = [];

function polar(r, deg) {
  const a = deg * Math.PI / 180;
  return [GAUGE.cx + r * Math.cos(a), GAUGE.cy + r * Math.sin(a)];
}

function lerpColor(a, b, t) {
  return a.map((v, i) => Math.round(v + (b[i] - v) * t));
}
// 速さの割合で 水色 → 黄 → 赤 と変える
function speedColor(ratio) {
  const c = ratio < 0.7 ? lerpColor([0, 200, 255], [255, 210, 0], ratio / 0.7)
                        : lerpColor([255, 210, 0], [255, 60, 60], (ratio - 0.7) / 0.3);
  return `rgb(${c})`;
}

function buildGauge() {
  for (let a = 0; a < GAUGE.sweep; a += GAUGE.step) {
    const d0 = GAUGE.start + a, d1 = d0 + GAUGE.step + 0.3;
    const [x0, y0] = polar(GAUGE.rOut, d0), [x1, y1] = polar(GAUGE.rOut, d1);
    const [x2, y2] = polar(GAUGE.rIn, d1), [x3, y3] = polar(GAUGE.rIn, d0);
    const p = document.createElementNS(svgNS, "path");
    p.setAttribute("d", `M${x0} ${y0}A${GAUGE.rOut} ${GAUGE.rOut} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${GAUGE.rIn} ${GAUGE.rIn} 0 0 0 ${x3} ${y3}Z`);
    p.dataset.color = speedColor(a / GAUGE.sweep);
    $("segments").appendChild(p);
    segments.push(p);
  }
  // 目盛り。20ごとに長い線と数字
  for (let v = 0; v <= 100; v += 5) {
    const deg = GAUGE.start + GAUGE.sweep * v / 100;
    const major = v % 20 === 0;
    const r0 = GAUGE.rIn - 4, r1 = r0 - (major ? 9 : 4);
    const [x0, y0] = polar(r0, deg), [x1, y1] = polar(r1, deg);
    const l = document.createElementNS(svgNS, "line");
    Object.entries({ x1: x0, y1: y0, x2: x1, y2: y1, stroke: major ? "#dce4f0" : "#505868", "stroke-width": major ? 1.5 : 1 })
      .forEach(([k, val]) => l.setAttribute(k, val));
    $("ticks").appendChild(l);
    if (major) {
      const [tx, ty] = polar(r1 - 9, deg);
      const t = document.createElementNS(svgNS, "text");
      Object.entries({ x: tx, y: ty + 2.5, "text-anchor": "middle", "font-size": 7, fill: "#505868" })
        .forEach(([k, val]) => t.setAttribute(k, val));
      t.textContent = v;
      $("ticks").appendChild(t);
    }
  }
}

function drawGauge() {
  shownSpeed += (Math.abs(throttle) - shownSpeed) * 0.3;
  if (Math.abs(Math.abs(throttle) - shownSpeed) < 0.5) shownSpeed = Math.abs(throttle);
  const ratio = shownSpeed / 100;
  const filled = GAUGE.sweep * ratio;
  const reverse = throttle < 0;
  segments.forEach((p, i) => {
    p.setAttribute("fill", i * GAUGE.step < filled ? (reverse ? "#ff8c00" : p.dataset.color) : "#242836");
  });
  const needle = $("needle");
  needle.style.display = motor ? "" : "none";
  const [nx, ny] = polar((GAUGE.rOut + GAUGE.rIn) / 2, GAUGE.start + filled);
  needle.setAttribute("cx", nx);
  needle.setAttribute("cy", ny);
  const speed = Math.round(shownSpeed);
  $("speedText").textContent = speed;
  $("speedText").setAttribute("fill", speed === 0 ? "#505868" : "#dce4f0");
  requestAnimationFrame(drawGauge);
}

// ---- 傾き ----
// 画面の回転角（縦持ち 0、横持ちで 90 / -90 / 270）。機種やブラウザによって当てにならないので、最初の推定にだけ使う
function screenAngle() {
  return screen.orientation?.angle ?? window.orientation ?? 0;
}

// 横持ちのとき、画面の上が端末の +x 側なら 1、-x 側なら -1。0 はまだ分からない
let landscapeUp = 0;
const LANDSCAPE_UP_THRESHOLD = 0.4; // 端末の x 軸がこれ以上（約24度）立っているときだけ、どちらが上かを決め直す

// deviceorientation から「上」方向ベクトルを端末座標で求め、
// 画面の右方向とのなす量をハンドルの切れ角として使う（平置きでもハンドル持ちでも同じように効く）
function onOrientation(e) {
  const b = (e.beta ?? 0) * Math.PI / 180;
  const g = (e.gamma ?? 0) * Math.PI / 180;
  const ux = -Math.sin(g) * Math.cos(b);
  const uy = Math.sin(b);
  if (innerWidth <= innerHeight) {
    // 縦持ち: 画面の右方向は端末の +x。右側が下がると ux が負になる
    steerRaw = -ux;
    return;
  }
  // 横持ち: 画面の上側は少し持ち上げて持つので、上ベクトルの x 成分の符号で、どちら向きに横にしたかが分かる
  if (Math.abs(ux) > LANDSCAPE_UP_THRESHOLD) landscapeUp = Math.sign(ux);
  else if (landscapeUp === 0) landscapeUp = Math.sin(screenAngle() * Math.PI / 180) < 0 ? -1 : 1;
  // 画面の右方向は、上が +x なら端末の -y、上が -x なら +y
  steerRaw = landscapeUp * uy;
  debugOrientation?.(`angle ${screenAngle()} up ${landscapeUp} ux ${ux.toFixed(2)} uy ${uy.toFixed(2)}`);
}

function steerValue() {
  const s = steerReverse ? -steerRaw : steerRaw;
  if (Math.abs(s) < DEADZONE) return 0;
  return Math.max(-1, Math.min(1, s * STEER_GAIN));
}

function updateSteerMode() {
  $("steerMode").textContent = steerReverse ? "TILT REV" : "TILT";
  $("steerMode").classList.toggle("reverse", steerReverse);

// ---- 接続 ----
// 接続中は DISCONNECT_HOLD_MS 長押しで切断。途中で離したら何もしない
let disconnectTimer = null;
let heldToDisconnect = false; // 長押しで切断した。指を離すまで true
let ignoreClickUntil = 0;
function cancelDisconnectHold() {
  // 長押しで切断したあと指を離したときの click で、すぐ接続し直さないようにする
  if (heldToDisconnect) { heldToDisconnect = false; ignoreClickUntil = performance.now() + 500; }
  clearTimeout(disconnectTimer);

  $("connect").classList.remove("holding");
}

  e.preventDefault();
  $("connect").classList.add("holding");
  disconnectTimer = setTimeout(async () => {

    heldToDisconnect = true;
    await sendMotor(0, 0, true);
    device?.gatt.disconnect();
  }, DISCONNECT_HOLD_MS);
});
["pointerup", "pointercancel", "pointerleave"].forEach((t) => $("connect").addEventListener(t, cancelDisconnectHold));

$("connect").addEventListener("click", async () => {
  if (motor || heldToDisconnect || performance.now() < ignoreClickUntil) return;
  try {
    // 1. 傾きセンサーの許可（iOS は必須、ユーザー操作の中で呼ぶ）
    if (!orientationListening) {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        const p = await DeviceOrientationEvent.requestPermission();
        if (p !== "granted") { setStatus("傾きの許可が得られませんでした", "red"); return; }
      }
      window.addEventListener("deviceorientation", onOrientation);
      orientationListening = true;
    }

    // 2. BLE 接続
    if (!navigator.bluetooth) { setStatus("このブラウザは Web Bluetooth 非対応です", "red"); return; }
    setStatus("toio を探しています…", "yellow");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
    });
    device.addEventListener("gattserverdisconnected", () => {
      motor = sound = null;
      stopAuto();
      updateConnection();
      setStatus("切断されました", "yellow");
    });
    setStatus("接続しています…", "yellow");
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    const m = await service.getCharacteristic(MOTOR_UUID);
    try { sound = await service.getCharacteristic(SOUND_UUID); } catch (_) {}
    lastSound = STOP_SOUND;
    try {
      const battery = await service.getCharacteristic(BATTERY_UUID);
      battery.addEventListener("characteristicvaluechanged", (e) => setBattery(e.target.value.getUint8(0)));
      setBattery((await battery.readValue()).getUint8(0));
      await battery.startNotifications();
    } catch (_) {}
    motor = m;
    updateConnection();
    setStatus("接続しました：" + (device.name || "toio"), "green");

    // 画面が消えないようにする（対応環境のみ）
    try { await navigator.wakeLock?.request("screen"); } catch (_) {}
  } catch (err) {
    setStatus("エラー: " + err.message, "red");
  }
});

// 押している間だけ効くボタン
function bindHold(el, set) {
  const on = (e) => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); el.classList.add("pressed"); set(true); };
  const off = () => { if (!el.classList.contains("pressed")) return; el.classList.remove("pressed"); set(false); };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off);
  el.addEventListener("lostpointercapture", off);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}
bindHold($("forward"), (v) => { forwardPressed = v; });
bindHold($("back"), (v) => { backPressed = v; });
bindHold($("spin"), (v) => { spinPressed = v; });
// HORN はメーターの中心から HORN_HIT_R 以内に触れたら押したことにする（見た目より広め）
const HORN_HIT_R = 56;     // メーターの座標 (220x200) での半径。HORN の見た目は 34
function isHornHit(e) {
  const r = $("gaugeBox").getBoundingClientRect();
  const scale = r.width / 220;
  const dx = (e.clientX - r.left) / scale - GAUGE.cx;
  const dy = (e.clientY - r.top) / scale - GAUGE.cy;
  return dx * dx + dy * dy <= HORN_HIT_R * HORN_HIT_R;
}
let hornPointer = null;
function setHorn(v) {
  hornPressed = v;
  $("horn").classList.toggle("pressed", v);
  refreshSound(); // 短く押しただけでも鳴るよう、次の周期を待たずに送る
}
$("gaugeBox").addEventListener("pointerdown", (e) => {
  if (!motor || hornPointer !== null || !isHornHit(e)) return;
  e.preventDefault();
  hornPointer = e.pointerId;
  $("gaugeBox").setPointerCapture?.(e.pointerId);
  setHorn(true);
});
const releaseHorn = (e) => {
  if (e.pointerId !== hornPointer) return;
  hornPointer = null;
  setHorn(false);
};
["pointerup", "pointercancel", "lostpointercapture"].forEach((t) => $("gaugeBox").addEventListener(t, releaseHorn));
$("gaugeBox").addEventListener("contextmenu", (e) => e.preventDefault());

// 画面から離れたら止める

// ---- 走り ----
// 符号付き速度 → toio の [向き, 速度]
function toMotor(speed) {
  let s = Math.round(Math.min(Math.abs(speed), MAX_SPEED));
  if (s < MIN_SPEED) s = 0;
  return [speed >= 0 ? 0x01 : 0x02, s];
}

function sendMotor(left, right, force = false) {
  if (!motor || (motorQueued && !force)) return Promise.resolve();
  motorQueued = true;
  const [dl, sl] = toMotor(left);
  const [dr, sr] = toMotor(right);
  // 0x01: 時間指定なしモーター制御 / 左モーター(0x01) / 右モーター(0x02)
  const data = new Uint8Array([0x01, 0x01, dl, sl, 0x02, dr, sr]);
  const m = motor;
  return enqueue(() => m.writeValueWithoutResponse(data))
    .catch(() => {})
    .finally(() => { motorQueued = false; });
}

function updateSound(data) {
  if (!sound || data === lastSound) return;
  lastSound = data;
  const s = sound;
  enqueue(() => s.writeValueWithResponse(new Uint8Array(data))).catch(() => {});
}

// クラクションボタンを押している間はクラクション。それ以外で後ろに動いている間はバック音
function refreshSound() {
  updateSound(hornPressed ? HORN_SOUND : throttle < 0 ? BACKUP_SOUND : STOP_SOUND);
}

setInterval(() => {
  if (autoMode) return; // オートモードの間は動きと音をオートモードに任せる
  const steer = steerValue();
  const g = SPEED_GEARS[speedGear];

  // 前進と後退を同時押し・どちらも押していない → 停止
  let target = 0;
  if (forwardPressed && !backPressed) target = g.forward;
  else if (backPressed && !forwardPressed) target = -g.back;
  if (!motor) target = 0;

  // 目標の速さへ少しずつ近づける。速くなるときは ACCEL、遅くなるとき（向きが変わるときも）は DECEL
  const speedingUp = Math.abs(target) > Math.abs(throttle) && (throttle === 0 || Math.sign(target) === Math.sign(throttle));
  const step = (speedingUp ? ACCEL : DECEL) * SEND_INTERVAL / 1000;
  throttle = Math.abs(target - throttle) <= step ? target : throttle + Math.sign(target - throttle) * step;

  updateSteer(steer);
  updateGear();
  if (spinPressed) {
    // SPIN は一番優先。左のモーターを前、右を後ろに回してその場で右回り
    throttle = 0;
    sendMotor(SPIN_SPEED, -SPIN_SPEED);
  } else {
    // 曲がる量は今の速さに合わせる。後退中は車のバックと同じ向きに曲がる
    const turn = steer * throttle * TURN_RATIO;
    sendMotor(throttle + turn, throttle - turn);
  }
  refreshSound();
}, SEND_INTERVAL);

// ---- オートモード ----
// 位置を測れないので、時間で動かす。曲がる角度がずれるときは TURN_DEG_PER_SEC を実機に合わせる
const TURN_SPEED = 20;          // その場で曲がるときの左右の速さ
const TURN_DEG_PER_SEC = 200;   // TURN_SPEED でその場で回ったときの 1秒あたりの角度（目安）
const turnMs = (deg) => Math.round(Math.abs(deg) / TURN_DEG_PER_SEC * 1000);
const turn = (deg) => ({ l: Math.sign(deg) * TURN_SPEED, r: -Math.sign(deg) * TURN_SPEED, ms: turnMs(deg) });
const MOTION_MS = 10000;
const go = (l, r, ms) => ({ l, r, ms });
const rest = (ms) => ({ l: 0, r: 0, ms });

// 動き: 1回分を繰り返し、MOTION_MS くらいたったら区切りのいいところで止まる
const MOTIONS = {
  circle: [go(45, 20, 3000)],
  square: [go(40, 40, 1500), rest(300), turn(90), rest(300)],
  eight: [go(45, 20, 4000), go(20, 45, 4000)],
  dance: [turn(45), turn(-90), turn(45), go(35, 35, 450), go(-35, -35, 450), go(35, 35, 450), go(-35, -35, 450), turn(360), rest(300)],
};

// 曲: [ノート番号, 拍] の並び。ノート番号 128 は休み。C4 = 60
function melody(beatMs, notes, repeat = 1) {
  const data = [0x03, repeat, 0];
  let total = 0;
  notes.forEach(([note, beats], i) => {
    const d = Math.round(beats * beatMs / 10);
    // 同じ音が続くときだけ、区切れて聞こえるよう少し休む（toio が一度に受け取れる音の数を節約する）
    const gap = note !== 128 && notes[i + 1]?.[0] === note ? 3 : 0;
    data.push(d - gap, note, note === 128 ? 0 : 200);
    if (gap) data.push(gap, 128, 0);
    total += d * 10;
  });
  data[2] = (data.length - 3) / 3; // toio が一度に受け取れるのは 59 音まで
  return { data, ms: total * repeat };
}
const [C4, D4, E4, F4, G4, A4, Ab4, Bb4, C5, G5, B5] = [60, 62, 64, 65, 67, 69, 68, 70, 72, 79, 83];
const R = 128;
const [D5, E5, C6, E6] = [74, 76, 84, 88];
const [G3, A3, B3, B4, F5] = [55, 57, 59, 71, 77];

// 音の高さを細かく上げ下げして、サイレンのように音が滑らかに変わって聞こえるようにする
function glide(from, to, stepBeats) {
  const dir = Math.sign(to - from);
  const out = [];
  for (let n = from; n !== to; n += dir) out.push([n, stepBeats]);
  return out;
}
const MUSIC = {

    [G4, 1], [G4, 1], [F4, 1], [F4, 1], [E4, 1], [E4, 1], [D4, 2],
    [G4, 1], [G4, 1], [F4, 1], [F4, 1], [E4, 1], [E4, 1], [D4, 2],
  ]),
  frog: melody(550, [
    [C4, 1], [D4, 1], [E4, 1], [F4, 1], [E4, 1], [D4, 1], [C4, 2],

let autoMode = false;
let motionKey = null, motionToken = 0;
let musicKey = null, musicTimer = null;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function updateAutoButtons() {
  document.querySelectorAll("[data-motion]").forEach((b) => b.classList.toggle("active", b.dataset.motion === motionKey));
  document.querySelectorAll("[data-music]").forEach((b) => b.classList.toggle("active", b.dataset.music === musicKey));
}

// 時間指定つきモーター制御。BLE が途切れても toio が自分で止まる
function sendTimedMotor(left, right, ms) {
  if (!motor) return;
  const [dl, sl] = toMotor(left);
  const [dr, sr] = toMotor(right);
  const data = new Uint8Array([0x02, 0x01, dl, sl, 0x02, dr, sr, Math.min(255, Math.ceil(ms / 10))]);
  const m = motor;
  enqueue(() => m.writeValueWithoutResponse(data)).catch(() => {});
}

async function runMotion(key) {
  const token = ++motionToken;
  motionKey = key;
  updateAutoButtons();
  const cycleMs = MOTIONS[key].reduce((sum, step) => sum + step.ms, 0);
  const cycles = Math.max(1, Math.round(MOTION_MS / cycleMs));
  for (let i = 0; i < cycles; i++) {
    for (const step of MOTIONS[key]) {
      // 次の命令が届くまで止まらないよう、少し長めに指定する
      for (let left = step.ms; left > 0; left -= 2000) {
        if (token !== motionToken || !motor) return;
        const ms = Math.min(left, 2000);
        sendTimedMotor(step.l, step.r, ms + 100);
        await sleep(ms);
      }
    }
  }
  if (token === motionToken) stopMotion();
}

function stopMotion() {
  motionToken++;
  motionKey = null;
  sendMotor(0, 0, true);
  updateAutoButtons();
}

function playMusic(key) {
  clearTimeout(musicTimer);
  musicKey = key;
  updateSound(MUSIC[key].data);
  musicTimer = setTimeout(stopMusic, MUSIC[key].ms + 200);
  updateAutoButtons();
}

function stopMusic() {
  clearTimeout(musicTimer);
  musicKey = null;
  updateSound(STOP_SOUND);
  updateAutoButtons();
}

function stopAuto() {
  if (motionKey) stopMotion();
  if (musicKey) stopMusic();
}

document.querySelectorAll("[data-motion]").forEach((b) => b.addEventListener("click", () => {
  if (!motor) { setStatus("先に CONNECT で toio に接続してください", "yellow"); return; }
  if (motionKey === b.dataset.motion) stopMotion(); else runMotion(b.dataset.motion);
}));
document.querySelectorAll("[data-music]").forEach((b) => b.addEventListener("click", () => {
  if (!motor) { setStatus("先に CONNECT で toio に接続してください", "yellow"); return; }
  if (musicKey === b.dataset.music) stopMusic(); else playMusic(b.dataset.music);
}));

$("modeSwitch").addEventListener("click", () => {
  autoMode = !autoMode;
  stopAuto();
  forwardPressed = backPressed = spinPressed = false;
  throttle = 0;
  sendMotor(0, 0, true);
  updateSound(STOP_SOUND); // コックピットのバック音などを止める
  document.body.classList.toggle("auto", autoMode);
  $("modeSwitch").textContent = autoMode ? "COCKPIT" : "AUTO";
  $("brand").textContent = autoMode ? "toio AUTO" : "toio COCKPIT";
});

// ---- 調査用: URL に ?debug を付けると、触った位置と反応した要素を画面に出す ----
if (new URLSearchParams(location.search).has("debug")) {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:100px;top:40px;right:35vw;z-index:99;font:11px/1.3 monospace;color:#0f0;background:#000c;pointer-events:none;white-space:pre-wrap;max-height:60vh;overflow:hidden;padding:4px";
  document.body.appendChild(box);
  const lines = [];
  const orientationLine = document.createElement("div");
  orientationLine.style.color = "#ff0";
  const logLines = document.createElement("div");
  box.append(orientationLine, logLines);
  debugOrientation = (m) => { orientationLine.textContent = m; };
  const log = (m) => { lines.unshift(m); lines.length = Math.min(lines.length, 14); logLines.textContent = lines.join("\n"); };
  const vv = window.visualViewport;
  const viewInfo = () => `view ${innerWidth}x${innerHeight} scroll ${scrollX},${scrollY}` +
    ` angle ${screen.orientation?.angle ?? "-"} / ${window.orientation ?? "-"}` +
    (vv ? ` vv ${Math.round(vv.width)}x${Math.round(vv.height)} @${vv.offsetLeft},${vv.offsetTop} x${vv.scale.toFixed(2)}` : "");
  log(viewInfo());
  const dot = (x, y, color) => {
    const d = document.createElement("div");
    d.style.cssText = `position:fixed;left:${x - 6}px;top:${y - 6}px;width:12px;height:12px;border-radius:50%;background:${color};z-index:100;pointer-events:none`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1500);
  };
  const name = (el) => el?.closest?.("[id]")?.id ?? el?.nodeName ?? "-";
  ["pointerdown", "pointerup", "pointercancel", "lostpointercapture", "click"].forEach((t) =>
    document.addEventListener(t, (e) => {
      if (t === "pointerdown") dot(e.clientX, e.clientY, "#f0f");
      log(`${t} ${Math.round(e.clientX)},${Math.round(e.clientY)} target=${name(e.target)}`);
    }, true));
  ["touchstart", "touchend", "touchcancel"].forEach((t) =>
    document.addEventListener(t, (e) => {
      const p = e.changedTouches[0];
      if (t === "touchstart") dot(p.clientX, p.clientY, "#0ff");
      log(`${t} ${Math.round(p.clientX)},${Math.round(p.clientY)} target=${name(e.target)}`);
    }, true));
  window.addEventListener("resize", () => log(viewInfo()));
}

buildGauge();
updateSpeedGear();
updateSteerMode();
updateConnection();
updateGear();
requestAnimationFrame(drawGauge);
</script>
