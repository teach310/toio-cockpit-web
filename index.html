<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>toio 傾きコントローラー</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #111; color: #eee;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  button { font-size: 18px; padding: 14px; border-radius: 10px; border: none; color: #fff; width: 100%; }
  #left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #right { display: flex; flex-direction: column; gap: 12px; }
  #connect { background: #2a7; }
  #connect.connected { background: #777; }
  #calib { background: #357; }
  .drive { flex: 1; font-size: 32px; background: #335; touch-action: none; }
  .drive.active { background: #57c; }
  #status, #values { font-family: monospace; font-size: 13px; white-space: pre; overflow: hidden; }
  #steer { position: relative; height: 18px; background: #222; border-radius: 9px; }
  #steer::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #555; }
  #steerBar { position: absolute; top: 0; bottom: 0; background: #e93; border-radius: 9px; }
</style>
</head>
<body>
  <div id="left">
    <button id="connect">toio に接続</button>
    <button id="calib">今の傾きをゼロにする</button>
    <div id="steer"><div id="steerBar"></div></div>
    <div id="status">未接続</div>
    <div id="values"></div>
  </div>
  <div id="right">
    <button id="forward" class="drive">▲ 前進</button>
    <button id="back" class="drive">▼ 後退</button>
  </div>

<script>
const SERVICE_UUID = "10b20100-5b3b-4571-9508-cf3efcd7bbae";
const MOTOR_UUID   = "10b20102-5b3b-4571-9508-cf3efcd7bbae";

const MAX_SPEED = 115;     // toio のモーター最大指示値
const MIN_SPEED = 10;      // これ未満は動かないので 0 扱い
const FORWARD_SPEED = 50;
const BACK_SPEED = 30;
const TURN_SPEED = 20;     // 最大まで傾けたときの左右差（片側分）
const STEER_GAIN = 1.2;    // 約55度（sin≈0.83）傾けたら最大旋回
const DEADZONE = 0.08;     // 約5度以内は無視
const SEND_INTERVAL = 50;  // ms

let device = null;
let motor = null;
let writing = false;
let forwardPressed = false, backPressed = false;
let steerRaw = 0;          // 画面の左右方向の傾き（-1〜1、右に傾けると +）
let steer0 = 0;            // キャリブレーション値
let orientationListening = false;

const $ = (id) => document.getElementById(id);
const setStatus = (s) => { $("status").textContent = s; };

// 画面の回転角（縦持ち 0、横持ちで 90 / -90 / 270）
function screenAngle() {
  return screen.orientation?.angle ?? window.orientation ?? 0;
}

// deviceorientation から「上」方向ベクトルを端末座標で求め、
// 画面の右方向とのなす量をハンドルの切れ角として使う（平置きでもハンドル持ちでも同じように効く）
function onOrientation(e) {
  const b = (e.beta ?? 0) * Math.PI / 180;
  const g = (e.gamma ?? 0) * Math.PI / 180;
  const ux = -Math.sin(g) * Math.cos(b);
  const uy = Math.sin(b);
  const t = screenAngle() * Math.PI / 180;
  // 画面の右方向（端末座標）= (cos t, -sin t)。右側が下がると上ベクトルとの内積が負になる
  steerRaw = -(ux * Math.cos(t) - uy * Math.sin(t));
}

function updateConnectButton() {
  const btn = $("connect");
  btn.textContent = motor ? "toio から切断" : "toio に接続";
  btn.classList.toggle("connected", !!motor);
}

$("connect").addEventListener("click", async () => {
  if (motor) {
    await sendMotor(0, 0, true);
    device?.gatt.disconnect();
    return;
  }
  try {
    // 1. 傾きセンサーの許可（iOS は必須、ユーザー操作の中で呼ぶ）
    if (!orientationListening) {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        const p = await DeviceOrientationEvent.requestPermission();
        if (p !== "granted") { setStatus("傾きの許可が得られませんでした"); return; }
      }
      window.addEventListener("deviceorientation", onOrientation);
      orientationListening = true;
    }

    // 2. BLE 接続
    if (!navigator.bluetooth) { setStatus("このブラウザは Web Bluetooth 非対応です"); return; }
    setStatus("toio を探しています…");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
    });
    device.addEventListener("gattserverdisconnected", () => {
      motor = null;
      updateConnectButton();
      setStatus("切断されました");
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    motor = await service.getCharacteristic(MOTOR_UUID);
    updateConnectButton();
    setStatus("接続しました：" + (device.name || "toio"));

    // 画面が消えないようにする（対応環境のみ）
    try { await navigator.wakeLock?.request("screen"); } catch (_) {}
  } catch (err) {
    setStatus("エラー: " + err.message);
  }
});

$("calib").addEventListener("click", () => { steer0 = steerRaw; });

// 押している間だけ走る
function bindHold(id, set) {
  const el = $(id);
  const on = (e) => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); set(true); el.classList.add("active"); };
  const off = () => { set(false); el.classList.remove("active"); };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off);
  el.addEventListener("lostpointercapture", off);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}
bindHold("forward", (v) => { forwardPressed = v; });
bindHold("back", (v) => { backPressed = v; });

// 画面から離れたら止める
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { forwardPressed = backPressed = false; sendMotor(0, 0, true); }
});

// 符号付き速度 → toio の [向き, 速度]
function toMotor(speed) {
  let s = Math.round(Math.min(Math.abs(speed), MAX_SPEED));
  if (s < MIN_SPEED) s = 0;
  return [speed >= 0 ? 0x01 : 0x02, s];
}

async function sendMotor(left, right, force = false) {
  if (!motor || (writing && !force)) return;
  writing = true;
  const [dl, sl] = toMotor(left);
  const [dr, sr] = toMotor(right);
  // 0x01: 時間指定なしモーター制御 / 左モーター(0x01) / 右モーター(0x02)
  const data = new Uint8Array([0x01, 0x01, dl, sl, 0x02, dr, sr]);
  try { await motor.writeValueWithoutResponse(data); }
  catch (_) {}
  finally { writing = false; }
}

function steerValue() {
  const s = steerRaw - steer0;
  if (Math.abs(s) < DEADZONE) return 0;
  return Math.max(-1, Math.min(1, s * STEER_GAIN));
}

setInterval(() => {
  const steer = steerValue();

  // 前進と後退を同時押し・どちらも押していない → 停止
  let base = 0, turn = 0;
  if (forwardPressed && !backPressed) { base = FORWARD_SPEED; turn = steer * TURN_SPEED; }
  else if (backPressed && !forwardPressed) { base = -BACK_SPEED; turn = -steer * TURN_SPEED; } // 車のバックと同じ向きに曲がる
  const left = base + turn;
  const right = base - turn;

  const bar = $("steerBar");
  bar.style.left = (50 + Math.min(0, steer) * 50) + "%";
  bar.style.width = (Math.abs(steer) * 50) + "%";
  $("values").textContent =
    `steer ${steer.toFixed(2)} (raw ${(steerRaw - steer0).toFixed(2)})\n` +
    `L ${Math.round(left)}  R ${Math.round(right)}`;

  sendMotor(left, right);
}, SEND_INTERVAL);
</script>
</body>
</html>
